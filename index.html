<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Safety News Digest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen relative overflow-x-hidden antialiased">
  <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-blue-100 blur-[120px] pointer-events-none"></div>
  <div class="absolute top-[40%] right-[-10%] w-[45vw] h-[45vw] rounded-full bg-purple-100 blur-[140px] pointer-events-none"></div>

  <nav class="border-b border-slate-200 bg-white/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-4">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-2 rounded-lg text-white font-bold text-sm tracking-wider shadow-lg shadow-blue-500/20">★</div>
        <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-slate-900 to-slate-500 bg-clip-text text-transparent">AI Safety News Digest</span>
      </a>
      <div id="generated-date" class="hidden sm:block text-sm text-slate-500 font-mono bg-slate-100 px-3 py-1 rounded-full border border-slate-200">Loading...</div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">
    <section class="mb-12">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm"><p class="text-xs text-slate-500 uppercase font-mono tracking-wider">Articles Fetched</p><p id="stats-fetched" class="text-2xl font-bold mt-1 text-blue-600">—</p></div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm"><p class="text-xs text-slate-500 uppercase font-mono tracking-wider">Freshness Filter</p><p id="stats-fresh" class="text-2xl font-bold mt-1 text-indigo-600">—</p></div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm"><p class="text-xs text-slate-500 uppercase font-mono tracking-wider">Deduplicated</p><p id="stats-dedup" class="text-2xl font-bold mt-1 text-purple-600">—</p></div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm"><p class="text-xs text-slate-500 uppercase font-mono tracking-wider">Analyzed / Top Pick</p><p id="stats-top" class="text-2xl font-bold mt-1 text-emerald-600">—</p></div>
      </div>
    </section>

    <div class="flex flex-col lg:flex-row gap-8">
      <aside class="lg:w-64 shrink-0 lg:sticky lg:top-24 h-fit">
        <div id="category-menu" class="space-y-1 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs font-semibold text-slate-500 uppercase px-3 mb-2 font-mono tracking-wider">Categories</p>
          <p class="text-sm text-slate-500 px-3 py-2">Loading...</p>
        </div>
        <div class="mt-4 bg-white p-3 rounded-xl border border-slate-200 shadow-sm"><a href="archive.html" class="block text-sm text-slate-600 hover:text-blue-600 px-3 py-2 rounded-lg hover:bg-slate-50 transition">查看历史归档 →</a></div>
      </aside>
      <div id="news-sections" class="flex-1 space-y-16"><div class="bg-white rounded-xl border border-slate-200 p-6 text-slate-600 shadow-sm">Loading latest digest...</div></div>
    </div>
  </main>

  <footer class="border-t border-slate-200 mt-24 py-8 bg-white relative z-10"><div class="max-w-7xl mx-auto px-4 text-sm text-slate-500"><p class="font-mono">© 2026 News Digest Project — AI Safety Research Data</p></div></footer>

  <script>
    const SECTION_STYLES={threats:{text:"text-rose-600",dot:"bg-rose-500"},threats_incidents:{text:"text-rose-600",dot:"bg-rose-500"},"agent-failures":{text:"text-orange-600",dot:"bg-orange-500"},ai_agent_failures:{text:"text-orange-600",dot:"bg-orange-500"},"major-players":{text:"text-blue-600",dot:"bg-blue-500"},ai_security_industry:{text:"text-blue-600",dot:"bg-blue-500"},"agents-os":{text:"text-violet-600",dot:"bg-violet-500"},ai_agents_os:{text:"text-violet-600",dot:"bg-violet-500"},research:{text:"text-emerald-600",dot:"bg-emerald-500"},research_regulation:{text:"text-emerald-600",dot:"bg-emerald-500"},default:{text:"text-blue-600",dot:"bg-blue-500"}};
    function getSectionStyle(id){return SECTION_STYLES[id]||SECTION_STYLES.default;}
    function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
    function formatDateTime(v){if(!v)return"";const d=new Date(v);if(Number.isNaN(d.getTime()))return escapeHtml(v);return d.toISOString().replace("T"," ").slice(0,16)+" UTC";}
    function formatScore(v){if(v===null||v===undefined||v==="")return"—";const n=Number(v);if(Number.isNaN(n))return escapeHtml(v);return n.toFixed(1).replace(/\.0$/,"")+"/10";}
    function getRelevanceBadgeClass(v){const n=Number(v);return (!Number.isNaN(n)&&n>=8)?"bg-rose-50 text-rose-700 border-rose-200":"bg-blue-50 text-blue-700 border-blue-200";}
    function getChineseCardSummary(a){return a.what_happened||a.what_happened_zh||a.detailed_summary||a.detailed_summary_zh||a.technical_details||a.technical_details_zh||a.why_it_matters||a.why_important||"";}
    function topicBadges(topics){if(!Array.isArray(topics)||!topics.length)return"";return topics.map(t=>`<span class="text-xs bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-md text-slate-600 font-mono">#${escapeHtml(t)}</span>`).join("");}
    function articleCard(a,sectionId,digestDate){const internalUrl=`article.html?date=${encodeURIComponent(digestDate||"")}&id=${encodeURIComponent(a.id)}`;const cn=getChineseCardSummary(a);return `<div class="group bg-white rounded-xl border border-slate-200 p-6 space-y-4 shadow-sm transition-all duration-300 ease-out hover:-translate-y-1 hover:border-blue-300 hover:shadow-md"><div class="flex justify-between items-start gap-4"><div class="space-y-1"><span class="text-xs font-mono text-slate-500">${escapeHtml(a.source||"Unknown")} • ${formatDateTime(a.published_at)}</span><h3 class="text-lg font-semibold text-slate-900 group-hover:text-blue-600 transition-colors duration-300"><a href="${internalUrl}">${escapeHtml(a.title)}</a></h3></div><div class="${getRelevanceBadgeClass(a.relevance)} px-3 py-1.5 rounded-lg text-center border min-w-[70px]"><span class="block text-xs font-mono opacity-70">Relevance</span><span class="text-sm font-bold font-mono">${formatScore(a.relevance)}</span></div></div><div class="space-y-2"><p class="text-slate-800 text-base leading-relaxed">${escapeHtml(a.summary||"")}</p>${cn?`<p class="text-slate-600 text-sm leading-relaxed border-l-2 border-slate-300 pl-3">${escapeHtml(cn)}</p>`:""}</div>${a.why_it_matters?`<div class="bg-amber-50 border-l-2 border-amber-500 p-3.5 rounded-r-lg"><span class="text-xs uppercase font-mono font-bold tracking-wider text-amber-700 block mb-1">Why it matters:</span><p class="text-slate-700 text-sm">${escapeHtml(a.why_it_matters)}</p></div>`:""}<div class="flex flex-wrap items-center justify-between gap-3 pt-2"><div class="flex flex-wrap gap-2">${topicBadges(a.topics)}</div>${a.url?`<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-500 hover:text-blue-600 transition">原文 ↗</a>`:""}</div></div>`;}
    function renderMenu(sections){document.querySelector("#category-menu").innerHTML=`<p class="text-xs font-semibold text-slate-500 uppercase px-3 mb-2 font-mono tracking-wider">Categories</p>${sections.map(s=>{const st=getSectionStyle(s.id);return `<a href="#${escapeHtml(s.id)}" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium text-sm transition border border-transparent"><span class="w-2 h-2 rounded-full ${st.dot}"></span><span>${escapeHtml(s.title)}</span><span class="ml-auto text-xs text-slate-400">${s.articles.length}</span></a>`;}).join("")}`;}
    function renderSections(sections,digestDate){const c=document.querySelector("#news-sections");if(!sections||!sections.length){c.innerHTML=`<div class="bg-white rounded-xl border border-slate-200 p-6 text-slate-600 shadow-sm">今天没有筛选出符合条件的新闻。</div>`;return;}c.innerHTML=sections.map(s=>{const st=getSectionStyle(s.id);return `<section id="${escapeHtml(s.id)}" class="space-y-6 scroll-mt-28"><div class="border-b border-slate-200 pb-3 flex items-center justify-between"><h2 class="text-2xl font-bold tracking-tight text-slate-900 flex items-center space-x-2"><span class="${st.text}">#</span><span>${escapeHtml(s.title)}</span></h2><span class="text-xs bg-white text-slate-500 px-2.5 py-1 rounded-full border border-slate-200 font-mono">${s.articles.length} items</span></div><div class="space-y-6">${s.articles.map(a=>articleCard(a,s.id,digestDate)).join("")}</div></section>`;}).join("");}
    async function loadNews(){try{const res=await fetch("./data/latest.json?ts="+Date.now());if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();document.querySelector("#generated-date").textContent=`Generated at ${formatDateTime(data.generated_at)} | ${escapeHtml(data.date)}`;document.querySelector("#stats-fetched").textContent=data.stats?.fetched??"—";document.querySelector("#stats-fresh").textContent=data.stats?.freshness_filtered??"—";document.querySelector("#stats-dedup").textContent=data.stats?.deduplicated??"—";document.querySelector("#stats-top").textContent=`${data.stats?.analyzed??"—"} / ${data.stats?.top_pick??"—"}`;renderMenu(data.sections||[]);renderSections(data.sections||[],data.date);}catch(err){document.querySelector("#news-sections").innerHTML=`<div class="bg-red-50 border border-red-200 rounded-xl p-6 text-red-700 shadow-sm">无法加载 <code>data/latest.json</code>。请确认 pipeline 已经生成 JSON，并且 GitHub Pages 路径正确。<div class="mt-2 text-xs font-mono text-red-500">${escapeHtml(err.message)}</div></div>`;}}
    loadNews();
  </script>
</body>
</html>
