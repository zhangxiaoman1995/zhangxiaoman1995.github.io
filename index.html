<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Safety News Digest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#060913',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #060913; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>

<body class="bg-darkBg text-slate-200 min-h-screen relative overflow-x-hidden antialiased">
  <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-blue-900/10 blur-[120px] pointer-events-none"></div>
  <div class="absolute top-[40%] right-[-10%] w-[45vw] h-[45vw] rounded-full bg-purple-900/10 blur-[140px] pointer-events-none"></div>

  <nav class="border-b border-white/5 bg-darkBg/60 backdrop-blur-md sticky top-0 z-50 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-4">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-2 rounded-lg text-white font-bold text-sm tracking-wider shadow-lg shadow-blue-500/20">α★</div>
        <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-slate-200 to-slate-500 bg-clip-text text-transparent">
          AI Safety News Digest
        </span>
      </a>
      <div id="generated-date" class="hidden sm:block text-sm text-slate-400 font-mono bg-white/5 px-3 py-1 rounded-full border border-white/5">
        Loading...
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">
    <section class="mb-12">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white/[0.02] backdrop-blur-md p-4 rounded-xl border border-white/10 shadow-xl">
          <p class="text-xs text-slate-400 uppercase font-mono tracking-wider">Articles Fetched</p>
          <p id="stats-fetched" class="text-2xl font-bold mt-1 text-blue-400">—</p>
        </div>
        <div class="bg-white/[0.02] backdrop-blur-md p-4 rounded-xl border border-white/10 shadow-xl">
          <p class="text-xs text-slate-400 uppercase font-mono tracking-wider">Freshness Filter</p>
          <p id="stats-fresh" class="text-2xl font-bold mt-1 text-indigo-400">—</p>
        </div>
        <div class="bg-white/[0.02] backdrop-blur-md p-4 rounded-xl border border-white/10 shadow-xl">
          <p class="text-xs text-slate-400 uppercase font-mono tracking-wider">Deduplicated</p>
          <p id="stats-dedup" class="text-2xl font-bold mt-1 text-purple-400">—</p>
        </div>
        <div class="bg-white/[0.02] backdrop-blur-md p-4 rounded-xl border border-white/10 shadow-xl">
          <p class="text-xs text-slate-400 uppercase font-mono tracking-wider">Analyzed / Top Pick</p>
          <p id="stats-top" class="text-2xl font-bold mt-1 text-emerald-400">—</p>
        </div>
      </div>
    </section>

    <div class="flex flex-col lg:flex-row gap-8">
      <aside class="lg:w-64 shrink-0 lg:sticky lg:top-24 h-fit">
        <div id="category-menu" class="space-y-1 bg-white/[0.01] backdrop-blur-md p-3 rounded-xl border border-white/5">
          <p class="text-xs font-semibold text-slate-500 uppercase px-3 mb-2 font-mono tracking-wider">Categories</p>
          <p class="text-sm text-slate-500 px-3 py-2">Loading...</p>
        </div>

        <div class="mt-4 bg-white/[0.01] backdrop-blur-md p-3 rounded-xl border border-white/5">
          <a href="archive.html" class="block text-sm text-slate-400 hover:text-blue-400 px-3 py-2 rounded-lg hover:bg-white/5 transition">
            查看历史归档 →
          </a>
        </div>
      </aside>

      <div id="news-sections" class="flex-1 space-y-16">
        <div class="bg-white/[0.02] backdrop-blur-md rounded-xl border border-white/10 p-6 text-slate-400">
          Loading latest digest...
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-white/5 mt-24 py-8 bg-black/40 backdrop-blur-md relative z-10">
    <div class="max-w-7xl mx-auto px-4 text-sm text-slate-500">
      <p class="font-mono">© 2026 News Digest Project — Confidential AI Safety Research Data</p>
    </div>
  </footer>

  <script>
    const SECTION_COLORS = {
      "threats": "rose",
      "agent-failures": "orange",
      "major-players": "blue",
      "agents-os": "violet",
      "research": "emerald",
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDateTime(value) {
      if (!value) return "";
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return escapeHtml(value);
      return parsed.toISOString().replace("T", " ").slice(0, 16) + " UTC";
    }

    function formatScore(value) {
      if (value === null || value === undefined || value === "") return "—";
      const num = Number(value);
      if (Number.isNaN(num)) return escapeHtml(value);
      return num.toFixed(1).replace(/\.0$/, "") + "/10";
    }

    function topicBadges(topics) {
      if (!Array.isArray(topics) || topics.length === 0) return "";
      return topics.map(topic => `
        <span class="text-xs bg-white/5 border border-white/5 px-2.5 py-1 rounded-md text-slate-400 font-mono">
          #${escapeHtml(topic)}
        </span>
      `).join("");
    }

    function articleCard(article, sectionId) {
      const color = SECTION_COLORS[sectionId] || "blue";
      const internalUrl = `article.html?id=${encodeURIComponent(article.id)}`;
      const sourceUrl = article.url || "#";

      return `
        <div class="group bg-white/[0.02] backdrop-blur-md rounded-xl border border-white/10 p-6 space-y-4 shadow-2xl transition-all duration-300 ease-out hover:-translate-y-1 hover:bg-white/[0.04] hover:border-blue-500/30 hover:shadow-blue-500/5">
          <div class="flex justify-between items-start gap-4">
            <div class="space-y-1">
              <span class="text-xs font-mono text-slate-500">
                ${escapeHtml(article.source || "Unknown")} • ${formatDateTime(article.published_at)}
              </span>
              <h3 class="text-lg font-semibold text-slate-300 group-hover:text-blue-400 transition-colors duration-300">
                <a href="${internalUrl}">${escapeHtml(article.rank)}. ${escapeHtml(article.title)}</a>
              </h3>
            </div>
            <div class="bg-${color}-500/5 text-${color}-400 px-3 py-1.5 rounded-lg text-center border border-${color}-500/10 min-w-[70px]">
              <span class="block text-xs font-mono text-${color}-300/70">Relevance</span>
              <span class="text-sm font-bold font-mono">${formatScore(article.relevance)}</span>
            </div>
          </div>

          <p class="text-slate-400 text-sm leading-relaxed">${escapeHtml(article.summary || "")}</p>

          ${article.why_it_matters ? `
            <div class="bg-white/5 border-l-2 border-amber-500/70 p-3.5 rounded-r-lg backdrop-blur-sm">
              <span class="text-xs uppercase font-mono font-bold tracking-wider text-amber-500 block mb-1">Why it matters:</span>
              <p class="text-slate-300 text-sm">${escapeHtml(article.why_it_matters)}</p>
            </div>
          ` : ""}

          <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
            <div class="flex flex-wrap gap-2">${topicBadges(article.topics)}</div>
            ${article.url ? `
              <a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-500 hover:text-blue-400 transition">
                原文 ↗
              </a>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderMenu(sections) {
      const menu = document.querySelector("#category-menu");
      menu.innerHTML = `
        <p class="text-xs font-semibold text-slate-500 uppercase px-3 mb-2 font-mono tracking-wider">Categories</p>
        ${sections.map(section => {
          const color = SECTION_COLORS[section.id] || "blue";
          return `
            <a href="#${escapeHtml(section.id)}" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-white/5 hover:text-white font-medium text-sm transition border border-transparent">
              <span class="w-2 h-2 rounded-full bg-${color}-500/70"></span>
              <span>${escapeHtml(section.title)}</span>
              <span class="ml-auto text-xs text-slate-600">${section.articles.length}</span>
            </a>
          `;
        }).join("")}
      `;
    }

    function renderSections(sections) {
      const container = document.querySelector("#news-sections");

      if (!sections || sections.length === 0) {
        container.innerHTML = `
          <div class="bg-white/[0.02] backdrop-blur-md rounded-xl border border-white/10 p-6 text-slate-400">
            今天没有筛选出符合条件的新闻。
          </div>
        `;
        return;
      }

      container.innerHTML = sections.map(section => {
        const color = SECTION_COLORS[section.id] || "blue";
        return `
          <section id="${escapeHtml(section.id)}" class="space-y-6 scroll-mt-28">
            <div class="border-b border-white/5 pb-3 flex items-center justify-between">
              <h2 class="text-2xl font-bold tracking-tight text-slate-300 flex items-center space-x-2">
                <span class="text-${color}-500">#</span>
                <span>${escapeHtml(section.title)}</span>
              </h2>
              <span class="text-xs bg-white/5 text-slate-400 px-2.5 py-1 rounded-full border border-white/10 font-mono">
                ${section.articles.length} items
              </span>
            </div>
            <div class="space-y-6">
              ${section.articles.map(article => articleCard(article, section.id)).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    async function loadNews() {
      try {
        const res = await fetch("./data/latest.json?ts=" + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.querySelector("#generated-date").textContent =
          `Generated at ${formatDateTime(data.generated_at)} | ${escapeHtml(data.date)}`;

        document.querySelector("#stats-fetched").textContent = data.stats?.fetched ?? "—";
        document.querySelector("#stats-fresh").textContent = data.stats?.freshness_filtered ?? "—";
        document.querySelector("#stats-dedup").textContent = data.stats?.deduplicated ?? "—";
        document.querySelector("#stats-top").textContent =
          `${data.stats?.analyzed ?? "—"} / ${data.stats?.top_pick ?? "—"}`;

        renderMenu(data.sections || []);
        renderSections(data.sections || []);
      } catch (err) {
        document.querySelector("#news-sections").innerHTML = `
          <div class="bg-red-500/5 border border-red-500/20 rounded-xl p-6 text-red-300">
            无法加载 <code>data/latest.json</code>。请确认 pipeline 已经生成 JSON，并且 GitHub Pages 路径正确。
            <div class="mt-2 text-xs font-mono text-red-300/70">${escapeHtml(err.message)}</div>
          </div>
        `;
      }
    }

    loadNews();
  </script>
</body>
</html>
