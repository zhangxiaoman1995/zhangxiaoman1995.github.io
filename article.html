<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新闻详情 - AI Safety News Digest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen relative overflow-x-hidden antialiased">
  <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-blue-100 blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-purple-100 blur-[120px] pointer-events-none"></div>
  <nav class="border-b border-slate-200 bg-white/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4"><div class="max-w-4xl mx-auto flex justify-between items-center gap-4"><a href="index.html" class="flex items-center space-x-3"><div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-2 rounded-lg text-white font-bold text-sm tracking-wider">★</div><span class="text-xl font-bold tracking-tight bg-gradient-to-r from-slate-900 to-slate-500 bg-clip-text text-transparent">AI Safety News Digest</span></a><div id="digest-date" class="text-sm text-slate-500 font-mono bg-slate-100 px-3 py-1 rounded-full border border-slate-200">Loading...</div></div></nav>
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-12 relative z-10 space-y-8"><a href="index.html" class="inline-flex items-center space-x-2 text-sm text-slate-500 hover:text-blue-600 transition-colors group"><svg class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg><span>返回新闻列表</span></a><div id="article-root" class="space-y-8"><div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 text-slate-600 shadow-sm">Loading article...</div></div></main>
  <footer class="border-t border-slate-200 mt-24 py-8 bg-white relative z-10"><div class="max-w-4xl mx-auto px-4 text-center sm:text-left text-sm text-slate-500"><p class="font-mono">© 2026 News Digest Project — AI Safety Research Data</p></div></footer>
  <script>
    function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
    function formatDateTime(v){if(!v)return"";const d=new Date(v);if(Number.isNaN(d.getTime()))return escapeHtml(v);return d.toISOString().replace("T"," ").slice(0,16)+" UTC";}
    function formatScore(v){if(v===null||v===undefined||v==="")return"—";const n=Number(v);if(Number.isNaN(n))return escapeHtml(v);return n.toFixed(1).replace(/\.0$/,"")+" / 10";}
    function getRelevanceBadgeClass(v){const n=Number(v);return(!Number.isNaN(n)&&n>=8)?"bg-rose-50 text-rose-700 border-rose-200":"bg-blue-50 text-blue-700 border-blue-200";}
    function looksIncomplete(text){const s=String(text||"").trim();if(!s)return true;return s.length<50||s.endsWith("...")||s.endsWith("…")||/[，、（(：:]$/.test(s);}
    function asList(v){if(Array.isArray(v))return v.filter(Boolean);if(typeof v==="string"&&v.trim())return v.split(/\n+/).map(x=>x.replace(/^[-•\d.、\s]+/,"").trim()).filter(Boolean);return[];}
    function topicBadges(topics){if(!Array.isArray(topics)||!topics.length)return"";return topics.map(t=>`<span class="text-xs bg-slate-100 border border-slate-200 px-3 py-1 rounded-md text-slate-600 font-mono">#${escapeHtml(t)}</span>`).join("");}
    function typeLabel(type){const labels={security_incident:"安全事件 / Security Incident",vulnerability:"漏洞披露 / Vulnerability",agent_failure:"代理失效 / Agent Failure",product_release:"产品发布 / Product Release",research_paper:"研究论文 / Research Paper",regulation_policy:"政策监管 / Regulation",industry_news:"行业动态 / Industry News"};return labels[type]||"类型待判定 / Article Type";}
    function workflowTitle(type){const titles={security_incident:"攻击链 / Attack Path",vulnerability:"漏洞机制 / Exploit Mechanism",agent_failure:"代理失效链路 / Agent Failure Sequence",product_release:"能力与控制流程 / Capability Workflow",research_paper:"研究方法 / Research Method",regulation_policy:"政策机制 / Policy Mechanism",industry_news:"关键进展 / Key Development"};return titles[type]||"机制、流程或方法 / Mechanism / Workflow";}
    function paragraphSection(title,text,color="blue"){if(!text)return"";const bars={blue:"bg-blue-500",indigo:"bg-indigo-500",violet:"bg-violet-500",emerald:"bg-emerald-500",amber:"bg-amber-500"};return`<section class="space-y-3"><h3 class="text-xs font-bold uppercase tracking-widest text-slate-500 font-mono flex items-center space-x-2"><span class="w-1 h-3 ${bars[color]||bars.blue} rounded-full"></span><span>${title}</span></h3><p class="text-slate-700 text-base leading-relaxed bg-slate-50 border border-slate-200 p-4 rounded-xl">${escapeHtml(text)}</p></section>`;}
    function listSection(title,items,color="cyan"){items=asList(items);if(!items.length)return"";const styles={cyan:["bg-cyan-500","text-cyan-600"],violet:["bg-violet-500","text-violet-600"],emerald:["bg-emerald-500","text-emerald-600"]};const st=styles[color]||styles.cyan;return`<section class="space-y-4"><h3 class="text-xs font-bold uppercase tracking-widest text-slate-500 font-mono flex items-center space-x-2"><span class="w-1 h-3 ${st[0]} rounded-full"></span><span>${title}</span></h3><ul class="space-y-3 text-slate-700 text-base leading-relaxed list-none pl-1">${items.map(item=>`<li class="flex items-start space-x-2.5"><span class="${st[1]} mt-1.5 shrink-0">▪</span><span>${escapeHtml(item)}</span></li>`).join("")}</ul></section>`;}
    function calloutSection(title,text,color="amber"){if(!text)return"";const styles={amber:"bg-amber-50 border-amber-500 text-amber-700",blue:"bg-blue-50 border-blue-500 text-blue-700"};const cls=styles[color]||styles.amber;return`<section class="${cls} border-l-4 p-5 rounded-r-xl space-y-2"><h3 class="text-sm font-bold uppercase tracking-wider font-mono">${title}</h3><p class="text-slate-700 text-sm sm:text-base leading-relaxed">${escapeHtml(text)}</p></section>`;}
    function renderArticle(a,data){document.title=`${a.title} - AI Safety News Digest`;document.querySelector("#digest-date").textContent=data.date||"";const type=a.article_type||"";const raw=a.detailed_summary||a.detailed_summary_zh||"";const detail=looksIncomplete(raw)?(a.summary||raw||""):raw;const what=a.what_happened||a.what_happened_zh||"";const tech=a.technical_details||a.technical_details_zh||"";const workflow=a.mechanism_or_workflow||a.mechanism_or_workflow_zh||a.attack_chain||[];const impact=a.impact||a.impact_zh||"";const defense=a.defense_or_followup||a.defense_or_followup_zh||a.defense_recommendations||[];const why=a.why_it_matters||a.why_important||a.why_important_zh||"";const takeaways=a.takeaways||a.key_takeaways_zh||a.key_takeaways||[];const action=a.recommended_action||a.recommended_action_zh||"";document.querySelector("#article-root").innerHTML=`<div class="border-b border-slate-200 pb-6 space-y-4"><div class="flex flex-wrap items-center justify-between gap-4"><div class="space-y-1"><div class="flex items-center space-x-3 text-xs font-mono text-slate-500"><span class="text-blue-600 font-bold">${escapeHtml(a.source||"Unknown")}</span><span>•</span><span>${formatDateTime(a.published_at)}</span></div><h1 class="text-2xl sm:text-3xl font-bold text-slate-900 leading-snug pt-1">${escapeHtml(a.title)}</h1></div><div class="${getRelevanceBadgeClass(a.relevance)} px-4 py-2 rounded-xl border text-center min-w-[90px] shrink-0"><span class="block text-xs font-mono uppercase tracking-wider opacity-80">Relevance</span><span class="text-lg font-black font-mono">${formatScore(a.relevance)}</span></div></div><div class="flex flex-wrap gap-2 pt-2">${type?`<span class="text-xs bg-blue-50 border border-blue-200 px-3 py-1 rounded-md text-blue-700 font-mono">${escapeHtml(typeLabel(type))}</span>`:""}${topicBadges(a.topics)}</div></div><article class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 space-y-8 shadow-sm">${paragraphSection("新闻深度总结 / Detailed Summary",detail,"blue")}${paragraphSection("发生了什么 / What Happened",what,"indigo")}${paragraphSection("关键技术细节 / Technical Details",tech,"violet")}${listSection(workflowTitle(type),workflow,"violet")}${paragraphSection("安全影响 / Security Impact",impact,"emerald")}${listSection("防护或跟进建议 / Defense & Follow-up",defense,"emerald")}${calloutSection("★ 核心洞察 / Why It Matters",why,"amber")}${listSection("深度分析与要点 / Detailed Takeaways",takeaways,"cyan")}${calloutSection("→ 建议跟进 / Recommended Action",action,"blue")}<div class="pt-4 border-t border-slate-200 flex justify-end">${a.url?`<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-2 bg-blue-50 hover:bg-blue-100 text-blue-700 px-5 py-2.5 rounded-xl border border-blue-200 text-sm font-medium transition-all"><span>访问源新闻出处</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg></a>`:""}</div></article>`;}
    async function loadArticle(){const p=new URLSearchParams(window.location.search);const id=p.get("id");const date=p.get("date");if(!id){document.querySelector("#article-root").innerHTML=`<div class="bg-red-50 border border-red-200 rounded-xl p-6 text-red-700 shadow-sm">缺少文章 id。请从首页点击文章进入。</div>`;return;}try{const file=date?`./data/${encodeURIComponent(date)}.json?ts=${Date.now()}`:`./data/latest.json?ts=${Date.now()}`;const res=await fetch(file);if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();const articles=data.articles||(data.sections||[]).flatMap(s=>s.articles||[]);const article=articles.find(x=>x.id===id);if(!article)throw new Error("Article not found in selected digest JSON");renderArticle(article,data);}catch(err){document.querySelector("#article-root").innerHTML=`<div class="bg-red-50 border border-red-200 rounded-xl p-6 text-red-700 shadow-sm">无法加载文章。请确认对应的 <code>data/YYYY-MM-DD.json</code> 或 <code>data/latest.json</code> 已生成，且文章 id 存在。<div class="mt-2 text-xs font-mono text-red-500">${escapeHtml(err.message)}</div></div>`;}}
    loadArticle();
  </script>
</body>
</html>
